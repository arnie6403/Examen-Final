<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat General - UMG</title>
    <!-- Tailwind CSS para diseño de interfaz tipo aplicación -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between font-sans">

    <!-- Encabezado del Chat -->
    <header class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-green-800 rounded-full flex items-center justify-center font-bold text-lg">
                P3
            </div>
            <div>
                <h1 class="text-lg font-bold">Sala Pública (Cod_Sala: 0)</h1>
                <p id="tokenStatus" class="text-xs text-green-200">Verificando conexión...</p>
            </div>
        </div>
        <button onclick="cerrarSesion()" class="bg-green-700 hover:bg-green-800 text-white text-xs py-1 px-3 rounded transition">
            Salir
        </button>
    </header>

    <!-- Contenedor Principal de Mensajes -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
        <div class="text-center text-gray-500 text-sm py-4 animate-pulse">Cargando mensajes...</div>
    </main>

    <!-- Formulario Inferior para Enviar Mensaje -->
    <footer class="bg-white border-t p-4 shrink-0 shadow-lg">
        <form id="messageForm" class="flex items-center space-x-2 max-w-5xl mx-auto">
            <input type="text" id="loginEmisor" required placeholder="Tu usuario" 
                   class="w-32 px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
            
            <input type="text" id="contenido" required autocomplete="off"
                   placeholder="Escribe un mensaje aquí..." 
                   class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            
            <button type="submit" id="btnEnviar"
                    class="bg-green-600 text-white px-5 py-2 rounded-md hover:bg-green-700 transition font-medium disabled:bg-gray-400">
                Enviar
            </button>
        </form>
    </footer>

    <script>
        // CONFIGURACIÓN DUAL DE URLs
        const URL_GET = 'https://examenfinalprogra319328.azurewebsites.net/api/mensajes'; // Para LEER el historial
        const URL_POST = 'https://backcvbgtmdesa.azurewebsites.net/api/Mensajes';        // Para ENVIAR (Oficial examen)

        const accessToken = localStorage.getItem('bearerToken');
        const chatContainer = document.getElementById('chatContainer');
        const tokenStatus = document.getElementById('tokenStatus');
        const btnEnviar = document.getElementById('btnEnviar');

        if (!accessToken) {
            alert("⚠️ Acceso denegado. Debes iniciar sesión en la Serie I.");
            window.location.href = 'index.html';
        } else {
            tokenStatus.textContent = "Conectado de forma segura con Token Bearer";
            cargarMensajes();
            setInterval(cargarMensajes, 5000); // Actualiza el chat cada 5 segundos
        }

        // --- OBTENER MENSAJES (GET) ---
        async function cargarMensajes() {
            try {
                // Hacemos el GET a la URL que sí soporta listado de mensajes
                const response = await fetch(URL_GET, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const mensajes = await response.json();
                chatContainer.innerHTML = '';

                // Filtrar para mostrar la sala pública 0
                const mensajesFiltrados = mensajes.filter(m => m.Cod_Sala === 0);

                if (mensajesFiltrados.length === 0) {
                    chatContainer.innerHTML = `<div class="text-center text-gray-400 py-4">No hay mensajes en esta sala todavía.</div>`;
                    return;
                }

                mensajesFiltrados.forEach(msg => {
                    const messageWrapper = document.createElement('div');
                    messageWrapper.className = "flex flex-col max-w-xs md:max-w-md p-3 rounded-lg shadow-xs bg-white border border-gray-100 text-gray-800 self-start";
                    
                    const fecha = new Date(msg.Fecha_Envio);
                    const horaFormateada = fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    messageWrapper.innerHTML = `
                        <span class="text-xs font-bold text-green-700 mb-1">${msg.Login_Emisor}</span>
                        <p class="text-sm break-words whitespace-pre-wrap">${escapeHTML(msg.Contenido)}</p>
                        <span class="text-[10px] text-gray-400 text-right mt-1 w-full">${horaFormateada}</span>
                    `;
                    
                    chatContainer.appendChild(messageWrapper);
                });

                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                console.error("Error al cargar mensajes:", error);
                tokenStatus.textContent = "❌ Error al actualizar el historial de chat.";
                tokenStatus.className = "text-xs text-red-200";
            }
        }

        // --- ENVIAR MENSAJE (POST) ---
        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginEmisor = document.getElementById('loginEmisor').value.trim();
            const contenidoInput = document.getElementById('contenido');
            const contenido = contenidoInput.value.trim();

            if (!contenido || !loginEmisor) return;

            btnEnviar.disabled = true;

            const payload = {
                Cod_Sala: 0,
                Login_Emisor: loginEmisor,
                Contenido: contenido
            };

            try {
                // El POST se envía a la URL oficial solicitada en tus instrucciones
                const response = await fetch(URL_POST, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    contenidoInput.value = '';
                    // Esperar un momento pequeño y recargar el visor
                    setTimeout(cargarMensajes, 500);
                } else {
                    alert(`Error ${response.status}: No se pudo entregar el mensaje al servidor del examen.`);
                }
            } catch (error) {
                console.error("Error al enviar:", error);
                alert("Error de red al intentar enviar.");
            } finally {
                btnEnviar.disabled = false;
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function cerrarSesion() {
            localStorage.removeItem('bearerToken');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
