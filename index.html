<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie I: Autenticación UMG</title>
    <!-- Tailwind CSS para un diseño limpio y rápido -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <!-- Encabezado -->
        <h2 class="text-2xl font-bold mb-2 text-center text-gray-800">Iniciar Sesión</h2>
        <p class="text-xs text-gray-500 text-center mb-6">Use la parte del correo antes del @miumg.edu.gt</p>
        
        <!-- Formulario de Login -->
        <form id="loginForm" class="space-y-4">
            <!-- Campo Usuario -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="username" required autocomplete="username"
                       placeholder="Ej: ctezop o oaranam3" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password"
                       placeholder="Contraseña de prueba: 123456a" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Botón de Envío -->
            <button type="submit" id="btnIngresar"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium disabled:bg-gray-400">
                Ingresar
            </button>
        </form>

        <!-- Contenedor para mostrar mensajes de error si la API falla -->
        <div id="errorMessage" class="mt-4 p-3 bg-red-100 text-red-700 rounded-md text-sm font-medium text-center hidden"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // 1. Capturar los valores ingresados por el usuario
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorMessageDiv = document.getElementById('errorMessage');
            const btnIngresar = document.getElementById('btnIngresar');

            // Ocultar mensajes de error previos y deshabilitar botón temporalmente
            errorMessageDiv.classList.add('hidden');
            btnIngresar.disabled = true;

            // 2. Estructurar el JSON exactamente como lo solicita la API
            const payload = {
                Username: usernameInput,
                Password: passwordInput
            };

            try {
                // 3. Realizar la petición POST a la API oficial de autenticación
                const response = await fetch('https://backcvbgtmdesa.azurewebsites.net/api/login/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // 4. Si la autenticación es exitosa, extraemos el Token Bearer de la respuesta.
                    // Probamos los nombres de propiedades comunes en respuestas JWT (data.token, data.tokenBearer o el string directo)
                    const token = data.token || data.tokenBearer || (typeof data === 'string' ? data : null); 

                    if (token) {
                        // 5. Guardar el Token de forma segura en localStorage
                        localStorage.setItem('bearerToken', token);
                        
                        // Guardar también el usuario para usarlo automáticamente en la pantalla de chat
                        localStorage.setItem('chatUsername', usernameInput);

                        // Redireccionar de inmediato a la interfaz de la Serie II
                        window.location.href = 'chat.html';
                    } else {
                        throw new Error('El servidor no devolvió un formato de token reconocido.');
                    }
                } else {
                    // Manejar errores de credenciales inválidas (Ej: Código 401 o 400)
                    errorMessageDiv.textContent = data.message || "Usuario o contraseña incorrectos.";
                    errorMessageDiv.classList.remove('hidden');
                }

            } catch (error) {
                // Manejar caídas de servidor o fallas de red
                errorMessageDiv.textContent = "Error: No se pudo establecer conexión con el servidor de autenticación.";
                errorMessageDiv.classList.remove('hidden');
                console.error('Falla en Login:', error);
            } finally {
                // Re-habilitar el botón de ingreso
                btnIngresar.disabled = false;
            }
        });
    </script>
</body>
</html>
