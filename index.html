<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - UMG</title>
    <!-- Tailwind CSS para diseño rápido -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Iniciar Sesión</h2>
        
        <form id="loginForm" class="space-y-4">
            <!-- Campo Usuario -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="username" required autocomplete="username"
                       placeholder="Ej: ctezop (sin @miumg.edu.gt)" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password"
                       placeholder="••••••••" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Botón de Envío -->
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium">
                Ingresar
            </button>
        </form>

        <!-- Mensajes de estado (Solo errores, ya que el éxito redirecciona) -->
        <div id="message" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.classList.add('hidden');
            messageDiv.className = "mt-4 text-center text-sm font-medium hidden";

            const payload = {
                Username: usernameInput,
                Password: passwordInput
            };

            try {
                const response = await fetch('https://backcvbgtmdesa.azurewebsites.net/api/login/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const token = data.token || data.tokenBearer || data; 

                    if (token) {
                        // 1. Guardar de forma segura en localStorage
                        localStorage.setItem('bearerToken', token);
                        
                        // 2. REDIRECCIÓN AUTOMÁTICA A LA SERIE II
                        window.location.href = 'chat.html';
                    } else {
                        throw new Error('No se encontró el token en la respuesta de la API.');
                    }
                } else {
                    messageDiv.textContent = data.message || "Error al autenticar. Verifica tus credenciales.";
                    messageDiv.classList.remove('hidden');
                    messageDiv.classList.add('text-red-600');
                }

            } catch (error) {
                messageDiv.textContent = "Hubo un problema de conexión con el servidor.";
                messageDiv.classList.remove('hidden');
                messageDiv.classList.add('text-red-600');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
